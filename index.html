<!DOCTYPE html>
<html lang="cs">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Henry D. Flores | Color Realism Tattoo Artist</title>

  <meta
    name="description"
    content="Henry D. Flores — tattoo artist specializing in color realism, fantasy and original custom tattoo projects in České Budějovice and Kirchheim unter Teck."
  >

  <link rel="stylesheet" href="styles.css">

  <style>

    .home-hero{
      min-height:100vh;
      display:grid;
      grid-template-columns:.9fr 1.1fr;
      gap:6vw;
      align-items:center;
      padding:140px 5vw 70px;
    }

    .home-copy{
      max-width:620px;
    }

    .home-title{
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(72px,8vw,118px);
      font-weight:400;
      line-height:.82;
      letter-spacing:-4px;
      margin:0;
    }

    .home-subtitle{
      max-width:500px;
      margin-top:34px;
      font-size:16px;
      line-height:1.8;
      color:#5d5b57;
    }

    .home-tags{
      display:flex;
      flex-wrap:wrap;
      gap:28px;
      margin-top:38px;
      font-size:10px;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    .home-tags span{
      padding-bottom:7px;
      border-bottom:1px solid rgba(47,47,47,.16);
    }

    .home-actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:42px;
    }

    .home-image{
      height:72vh;
      min-height:560px;
      overflow:hidden;
    }

    .home-image img{
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center center;
      display:block;
    }

    @media(max-width:850px){

      .home-hero{
        grid-template-columns:1fr;
        padding:125px 22px 55px;
      }

      .home-image{
        height:62vh;
        min-height:480px;
      }

      .home-title{
        letter-spacing:-2px;
      }

    }

  </style>
</head>


<body>


<header class="nav">

  <a class="brand" href="index.html">
    HENRY D. FLORES
  </a>

  <div class="nav-right">

    <nav class="nav-links">

      <a href="portfolio.html" data-i18n="navPortfolio">
        Portfolio
      </a>

      <a href="lixteo.html">
        Lixteo
      </a>

      <a href="artist.html" data-i18n="navArtist">
        Umělec
      </a>

      <a href="project.html" data-i18n="navProject">
        Projekt
      </a>

      <a href="contact.html" data-i18n="navContact">
        Kontakt
      </a>

    </nav>


    <div class="lang-switch">

      <button
        class="lang-btn"
        id="lang-cs"
        onclick="setLanguage('cs')"
      >
        CZ
      </button>

      <button
        class="lang-btn"
        id="lang-en"
        onclick="setLanguage('en')"
      >
        EN
      </button>

      <button
        class="lang-btn"
        id="lang-de"
        onclick="setLanguage('de')"
      >
        DE
      </button>

      <button
        class="lang-btn"
        id="lang-es"
        onclick="setLanguage('es')"
      >
        ES
      </button>

    </div>

  </div>

</header>



<main>

  <section class="home-hero">


    <div class="home-copy">

      <p
        class="eyebrow"
        data-i18n="heroEyebrow"
      >
        TATTOO ARTIST · COLOR REALISM
      </p>


      <h1
        class="home-title"
        data-i18n-html="heroTitle"
      >
        Umění<br>
        na kůži.
      </h1>


      <p
        class="home-subtitle"
        data-i18n="heroSubtitle"
      >
        Originální tetovací projekty založené na barvě,
        kompozici a vizuálním příběhu.
      </p>


      <div class="home-tags">

        <span>
          COLOR REALISM
        </span>

        <span>
          FANTASY
        </span>

        <span data-i18n="customProjects">
          INDIVIDUÁLNÍ PROJEKTY
        </span>

      </div>


      <div class="home-actions">

        <a
          class="btn primary"
          href="project.html"
          data-i18n="projectButton"
        >
          VYPLNIT FORMULÁŘ
        </a>


        <a
          class="btn"
          href="portfolio.html"
          data-i18n="portfolioButton"
        >
          ZOBRAZIT PORTFOLIO
        </a>

      </div>

    </div>



    <div class="home-image">

      <img
        src="images/IMG_8145.jpeg"
        alt="Fantasy color realism tattoo by Henry D. Flores"
      >

    </div>


  </section>

</main>



<script>

const translations = {

  cs: {

    navPortfolio: "Portfolio",
    navArtist: "Umělec",
    navProject: "Projekt",
    navContact: "Kontakt",

    heroEyebrow:
      "TATTOO ARTIST · COLOR REALISM",

    heroTitle:
      "Umění<br>na kůži.",

    heroSubtitle:
      "Originální tetovací projekty založené na barvě, kompozici a vizuálním příběhu.",

    customProjects:
      "INDIVIDUÁLNÍ PROJEKTY",

    projectButton:
      "VYPLNIT FORMULÁŘ",

    portfolioButton:
      "ZOBRAZIT PORTFOLIO"

  },


  en: {

    navPortfolio: "Portfolio",
    navArtist: "Artist",
    navProject: "Project",
    navContact: "Contact",

    heroEyebrow:
      "TATTOO ARTIST · COLOR REALISM",

    heroTitle:
      "Art<br>Beyond<br>Skin.",

    heroSubtitle:
      "Original tattoo projects built through color, composition and visual storytelling.",

    customProjects:
      "CUSTOM PROJECTS",

    projectButton:
      "FILL OUT THE FORM",

    portfolioButton:
      "VIEW PORTFOLIO"

  },


  de: {

    navPortfolio: "Portfolio",
    navArtist: "Künstler",
    navProject: "Projekt",
    navContact: "Kontakt",

    heroEyebrow:
      "TATTOO ARTIST · COLOR REALISM",

    heroTitle:
      "Kunst<br>auf der Haut.",

    heroSubtitle:
      "Individuelle Tattoo-Projekte mit Fokus auf Farbe, Komposition und visuelles Storytelling.",

    customProjects:
      "INDIVIDUELLE PROJEKTE",

    projectButton:
      "FORMULAR AUSFÜLLEN",

    portfolioButton:
      "PORTFOLIO ANSEHEN"

  },


  es: {

    navPortfolio: "Portafolio",
    navArtist: "Artista",
    navProject: "Proyecto",
    navContact: "Contacto",

    heroEyebrow:
      "TATTOO ARTIST · REALISMO A COLOR",

    heroTitle:
      "Arte<br>más allá<br>de la piel.",

    heroSubtitle:
      "Proyectos originales de tatuaje construidos mediante color, composición y narrativa visual.",

    customProjects:
      "PROYECTOS PERSONALIZADOS",

    projectButton:
      "LLENAR FORMULARIO",

    portfolioButton:
      "VER PORTAFOLIO"

  }

};


function setLanguage(language){

  localStorage.setItem(
    "language",
    language
  );

  document.documentElement.lang =
    language;


  document
    .querySelectorAll("[data-i18n]")
    .forEach(element => {

      const key =
        element.dataset.i18n;

      if(
        translations[language] &&
        translations[language][key]
      ){
        element.textContent =
          translations[language][key];
      }

    });


  document
    .querySelectorAll("[data-i18n-html]")
    .forEach(element => {

      const key =
        element.dataset.i18nHtml;

      if(
        translations[language] &&
        translations[language][key]
      ){
        element.innerHTML =
          translations[language][key];
      }

    });


  document
    .querySelectorAll(".lang-btn")
    .forEach(button => {
      button.classList.remove("active");
    });


  const active =
    document.getElementById(
      "lang-" + language
    );

  if(active){
    active.classList.add("active");
  }

}


const savedLanguage =
  localStorage.getItem("language") || "cs";

setLanguage(savedLanguage);

</script>


</body>
</html>
