<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Henry D. Flores | Tattoo Artist</title>

  <meta name="description" content="Henry D. Flores — tattoo artist specializing in custom tattoo projects and color realism.">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #FAF8F3;
      color: #181818;
    }

    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .hero {
      width: 100%;
      max-width: 1000px;
      text-align: center;
    }

    .name {
      font-size: clamp(42px, 8vw, 90px);
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 0.95;
    }

    .profession {
      margin-top: 20px;
      font-size: 15px;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .line {
      width: 60px;
      height: 2px;
      background: #181818;
      margin: 32px auto;
    }

    .description {
      max-width: 600px;
      margin: 0 auto;
      font-size: 18px;
      line-height: 1.7;
      color: #555;
    }

    .location {
      margin-top: 25px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .button {
      display: inline-block;
      margin-top: 40px;
      padding: 15px 30px;
      border: 1px solid #181818;
      color: #181818;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: 0.25s;
    }

    .button:hover {
      background: #181818;
      color: #FAF8F3;
    }
  </style>
</head>

<body>

  <main>
    <section class="hero">

      <h1 class="name">Henry D. Flores</h1>

      <p class="profession">Tattoo Artist</p>

      <div class="line"></div>

      <p class="description">
        Custom tattoo projects focused on strong composition,
        color, realism and original concepts.
      </p>

      <p class="location">
        České Budějovice · Germany
      </p>

      <a class="button" href="#">
        Portfolio coming soon
      </a>

    </section>
  </main>

</body>
</html>
